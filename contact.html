<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Afreach Creatives for branding, web development, digital marketing, and more.">
    <meta name="keywords" content="branding, web development, live streaming, digital marketing, publishing, Nairobi, creative agency">
    <title>Contact — Afreach Creatives</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="images/logo.png">
    <link rel="manifest" href="site.webmanifest">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FYZL907RTJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FYZL907RTJ');
    </script>
</head>
<body>
    <div id="preloader">
        <img src="images/logo.png" alt="Loading...">
    </div>

    <button class="sticky-cta btn-primary" onclick="openModal('quoteModal')">Get a Quote</button>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <img src="images/logo.png" alt="Afreach Creatives Logo">
            </a>
            <button class="navbar-toggle" onclick="toggleNav()">☰</button>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-overlay">
            <div class="container">
                <h1>Contact Us</h1>
                <p>Let's bring your vision to life. Reach out for a free consultation.</p>
                <div class="hero-ctas">
                    <a href="#" class="btn btn-primary" onclick="openModal('quoteModal')">Get a Quote</a>
                    <a href="tel:+254703579059" class="btn btn-secondary">Call Us</a>
                </div>
            </div>
        </div>
        <img src="images/hero1.jpg" alt="Contact Background" class="hero-background">
    </section>

    <section class="contact">
        <div class="container">
            <h2>Get in Touch</h2>
            <form id="contactForm" action="https://formspree.io/f/mjkedvkg" method="POST">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <select name="service" required>
                    <option value="" disabled selected>Select a Service</option>
                    <option value="Creative & Branding">Creative & Branding</option>
                    <option value="Web & App Development">Web & App Development</option>
                    <option value="Maintenance">Maintenance</option>
                    <option value="Digital Marketing">Digital Marketing</option>
                    <option value="Publishing">Publishing</option>
                    <option value="Live Streaming">Live Streaming</option>
                </select>
                <textarea name="message" placeholder="Your Message" required></textarea>
                <input type="text" name="budget" placeholder="Budget (e.g., $5000)">
                <input type="text" name="timeline" placeholder="Timeline (e.g., 1 month)">
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
    </section>

    <div id="quoteModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('quoteModal')">&times;</span>
            <h2>Get a Quote</h2>
            <form id="quoteForm" action="https://formspree.io/f/mjkedvkg" method="POST">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <select name="service" required>
                    <option value="" disabled selected>Select a Service</option>
                    <option value="Creative & Branding">Creative & Branding</option>
                    <option value="Web & App Development">Web & App Development</option>
                    <option value="Maintenance">Maintenance</option>
                    <option value="Digital Marketing">Digital Marketing</option>
                    <option value="Publishing">Publishing</option>
                    <option value="Live Streaming">Live Streaming</option>
                </select>
                <textarea name="message" placeholder="Your Message" required></textarea>
                <input type="text" name="budget" placeholder="Budget (e.g., $5000)">
                <input type="text" name="timeline" placeholder="Timeline (e.g., 1 month)">
                <button type="submit" class="btn btn-primary">Send Quote</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-brand">
                <h3>Afreach Creatives</h3>
            </div>
            <p>&copy; 2025 Afreach Creatives. All rights reserved.</p>
        </div>
    </footer>

    <script src="main.js"></script>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Afreach Creatives",
        "url": "https://afreachcreatives.com",
        "logo": "https://afreachcreatives.com/images/logo.png"
    }
    </script>
</body>
</html>
