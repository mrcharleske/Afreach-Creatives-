<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Contact — Afreach Creatives</title>
  <link rel="icon" href="images/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><img src="images/logo.jpg" alt="Afreach Creatives" class="logo" /></a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
      <div class="header-ctas">
        <a class="btn btn-ghost" href="tel:+254703579059">Call Us</a>
        <a class="btn btn-primary" id="quoteBtnTop5">Get a Quote</a>
      </div>
    </div>
  </header>

  <main class="container">
    <h1>Contact Us</h1>
    <div class="contact-grid">
      <div>
        <h3>Reach out</h3>
        <p>Phone / WhatsApp: <a href="tel:+254703579059">+254 703 579 059</a></p>
        <p>Email: <a href="mailto:afreachcreatives@gmail.com">afreachcreatives@gmail.com</a></p>
        <p>Address: Nairobi, Kenya (By appointment)</p>
        <div class="social-inline">
          <a href="https://www.linkedin.com/in/afreach-creatives-9802a6372?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=android_app" target="_blank">LinkedIn</a> |
          <a href="https://x.com/AfreachCreative?t=95xNXP91OWjgsZOZ8zrExg&s=09" target="_blank">X</a> |
          <a href="https://www.facebook.com/share/1D4xPeLRkc/" target="_blank">Facebook</a>
        </div>
      </div>

      <div>
        <form class="form" id="contactForm" method="POST" action="https://formspree.io/f/mjkedvkg">
          <label><span>Name</span><input type="text" name="name" required></label>
          <label><span>Email</span><input type="email" name="_replyto" required></label>
          <label><span>Phone</span><input type="tel" name="phone"></label>
          <label><span>Message</span><textarea name="message" rows="5" required></textarea></label>

          <!-- reCAPTCHA placeholder -->
          <div class="g-recaptcha" data-sitekey="RECAPTCHA_SITE_KEY_HERE"></div>

          <button class="btn btn-primary" type="submit">Send Message</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-left">
        <img src="images/logo.jpg" alt="Afreach Creatives" class="logo-sm" />
        <p>© <span id="year5"></span> Afreach Creatives</p>
      </div>
      <div class="footer-right">
        <a class="btn btn-ghost" href="index.html">Home</a>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById('year5').textContent = new Date().getFullYear();
  </script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script src="js/main.js"></script>
</body>
</html>
